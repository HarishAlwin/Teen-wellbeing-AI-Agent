databases:
  - name: teen-wellbeing-db
    databaseName: teen_wellbeing
    user: teen_admin
    plan: free
    region: oregon

services:
  # ── FastAPI Backend Service ───────────────────────────────────────────────
  - type: web
    name: teen-wellbeing-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/chat
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: teen-wellbeing-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: "http://localhost:3000,https://*.vercel.app"
      - key: DEFAULT_COUNTRY
        value: IN
      - key: USE_LOCAL_TRANSFORMERS
        value: "false"
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: GUEST_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_SPECIALIST_MODEL
        value: openai/gpt-oss-20b
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: ksryVoNAGZT8GxWCTiVm
      - key: EMERGENCY_AUTO_CALL_ENABLED
        value: "true"
      - key: EMERGENCY_DISPATCH_PHONE_NUMBER
        sync: false
      - key: ESCALATION_EMAIL_ENABLED
        value: "false"
      - key: EMERGENCY_CONTACT_NOTIFY_ENABLED
        value: "false"
